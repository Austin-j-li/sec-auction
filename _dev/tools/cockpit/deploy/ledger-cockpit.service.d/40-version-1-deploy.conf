# Version 1 deployment (_dev/alignment_sprint/SWITCHOVER.md). Keep 20-public-origin.conf beside it.
# Before installing, fill in the two empty values from the Cloudflare Zero Trust dashboard:
#   COCKPIT_ACCESS_TEAM_DOMAIN  the team domain, https://<team>.cloudflareaccess.com
#   COCKPIT_ACCESS_AUD          the Application Audience (AUD) tag of the Access application for lines.dealextract.org
# The server takes a reader only from a Cf-Access-Jwt-Assertion token verified with these (cockpit/access.py).
# Left empty, nobody can sign in, the public site is read-only and the server logs a warning at start.
[Service]
WorkingDirectory=%h/work/Projects/ledger-live
ExecStart=
ExecStart=/usr/bin/python3 %h/work/Projects/ledger-live/_dev/tools/cockpit/server.py --port 8778
Environment=TMPDIR=%h/work/tmp
Environment=COCKPIT_ACCESS_TEAM_DOMAIN=
Environment=COCKPIT_ACCESS_AUD=
