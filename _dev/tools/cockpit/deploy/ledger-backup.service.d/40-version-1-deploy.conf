# Version 1 deployment (_dev/alignment_sprint/SWITCHOVER.md). backup.py writes to ~/backups/ledger-live/,
# apart from the earlier app's nightlies in ~/backups/ledger-cockpit/, which its pruning never reaches.
[Service]
WorkingDirectory=%h/work/Projects/ledger-live
ExecStart=
ExecStart=/usr/bin/python3 %h/work/Projects/ledger-live/_dev/tools/cockpit/backup.py create
